name: Snapshot

on:
    push:
        branches: ["main"]

permissions:
    contents: write

jobs:
    calculate-version:
        name: Calculate Dev Version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Calculate version
              id: version
              shell: bash
              run: |
                  GIT_VERSION=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --always || echo "")
                  if [[ ! $GIT_VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
                    COMMIT_COUNT=$(git rev-list --count HEAD)
                    GIT_VERSION="v0.0.0-${COMMIT_COUNT}-${GITHUB_SHA:0:7}"
                  fi
                  echo "version=$GIT_VERSION" >> $GITHUB_OUTPUT
                  echo "Calculated version: $GIT_VERSION"

    build:
        needs: calculate-version
        uses: ./.github/workflows/ci-check.yml
        secrets: inherit
        with:
            artifact_suffix: "-Snapshot"
            upload_artifacts: true

    decky-plugin:
        needs: build
        uses: ./.github/workflows/decky-plugin.yml
        secrets: inherit
        with:
            artifact_suffix: "-Snapshot"
            buddy_artifact_name: "Buddy-linux-amd64-Snapshot"

    generate-changelog:
        name: Generate Changelog
        needs: build
        uses: ./.github/workflows/generate-changelog.yml
        with:
            mode: snapshot

    create-pre-release:
        name: Create Pre-Release
        needs: [build, decky-plugin, generate-changelog, calculate-version]
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Collect buddy-app snapshot files
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p release_files
                  for dir in artifacts/*; do
                    if [ -d "$dir" ]; then
                      base="$(basename "$dir")"
                      if [[ "$base" == Buddy-* ]] || [[ "$base" == DeckyPlugin-* ]]; then
                        for file in "$dir"/*; do
                          if [ -f "$file" ]; then
                            cp "$file" "release_files/$(basename "$file")"
                          fi
                        done
                      fi
                    fi
                  done
                  if [ -z "$(ls -A release_files)" ]; then
                    echo "ERROR: No artifacts found for snapshot release" >&2
                    ls -la artifacts || true
                    exit 1
                  fi
                  ls -la release_files

            - name: Update Dev Snapshot Release
              uses: andelf/nightly-release@main
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: dev-snapshot
                  name: "SteamInputDB Buddy - Dev Build ${{ needs.calculate-version.outputs.version }}"
                  prerelease: true
                  body: |
                      Automated development build.
                      ⚠️ These are the latest development builds and may contain bugs or unfinished features.

                      ${{ needs.generate-changelog.outputs.changelog }}
                  files: |
                      ./release_files/*
